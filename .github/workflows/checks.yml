name: Проверки

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Установить Tesseract и русскую модель
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-rus

      - name: Установить Python-зависимости
        run: python -m pip install --disable-pip-version-check -e .

      - name: Проверить окружение
        run: python doctor.py

      - name: Проверить реестр событий
        run: python events.py check

      - name: Проверить синтаксис
        run: python -m compileall -q *.py surnamefind

      - name: Запустить тесты
        run: python tests.py
