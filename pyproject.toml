[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "don-genealogy-search"
version = "0.1.0"
description = "Поиск фамилий в дореволюционных документах библиотеки Vivaldi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.5.2",
    "Pillow==12.3.0",
]

[tool.ruff.lint]
# Только то, что ломает запуск или прячет ошибку: неопределённые имена,
# забытые импорты, повторный ключ словаря. Оформление здесь не проверяется.
select = ["E9", "F"]

[tool.setuptools]
packages = ["surnamefind"]
