[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "don-genealogy-search"
version = "0.1.0"
description = "Поиск фамилий в дореволюционных документах библиотеки Vivaldi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow==12.3.0",
]

[tool.setuptools]
packages = ["surnamefind"]
