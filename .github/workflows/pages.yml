# Публикация журнала на GitHub Pages -> https://sacret.github.io/genealogy/
#
# Сайт здесь не пересобирается: journal.html — готовое, проверяемое локально
# представление, которое берётся из репозитория. Иконка не зависит от среды:
# journal.py встраивает сохранённый favicon.ico и в заголовок, и как favicon.
#
# Значит journal.html надо коммитить после поисков — он пересобирается сам
# при каждом вызове find.py, достаточно не забыть про git add.

name: Журнал на Pages

on:
  push:
    branches: [master]
    # Гонять деплой из-за правки в fetch.py незачем.
    paths:
      - journal.html
      - favicon.ico
      - social-card.png
      - "*/crops/**"
      - "*/scans/**"
      - .github/workflows/pages.yml
  # Ручной запуск: Actions -> в левом списке «Журнал на Pages» -> Run workflow.
  # Кнопка появляется на странице самого workflow, а не на общей вкладке.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои Pages конфликтуют; лишние запуски ждут, а не отменяются:
# отменённый на середине оставил бы сайт в промежуточном состоянии.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать сайт
        run: |
          set -eu
          mkdir -p site
          cp journal.html site/index.html
          cp favicon.ico social-card.png site/
          # Рядом с журналом выкладывается ровно то, на что он ссылается:
          # превью вырезок (они и стоят в строках), сами вырезки («полный
          # размер») и страницы находок («страница целиком»). Внутри
          # страницы не лежит ничего из этого: превью — двадцать килобайт
          # на находку, вырезка — четыреста, скан страницы — мегабайт, и
          # браузер берёт их по мере того, как читающий до них доходит.
          #
          # Список берётся из самого журнала, а не обходом папок. Обход
          # копировал заодно вырезки отсеявшихся кандидатов, которых в журнале
          # нет, и — по шаблону './bv*/crops' — не копировал ничего из выпусков
          # газеты, так что ссылки под находками в pn* вели в 404.
          #
          # src — это превью в строке, href и data-page — то, что открывается
          # по клику. Забыть здесь атрибут значит выложить журнал с пустыми
          # местами вместо находок; ненайденный файл сборка называет вслух
          # («ССЫЛКА В НИКУДА»), но деплой из-за него не останавливает —
          # одна пропавшая картинка дешевле, чем невыложенный журнал.
          grep -oE "(href|src|data-page)='[a-z]{2}[0-9]+/(crops|scans)/[^']+'" \
            journal.html | sed "s/^[^']*'//;s/'\$//" | sort -u > files.txt
          echo "файлов рядом с журналом: $(wc -l < files.txt)"
          while IFS= read -r f; do
            if [ ! -f "$f" ]; then echo "ССЫЛКА В НИКУДА: $f"; continue; fi
            mkdir -p "site/$(dirname "$f")"
            cp "$f" "site/$f"
          done < files.txt
          rm files.txt
          # На случай, если публикацию когда-нибудь переключат на ветку:
          # Jekyll молча выбрасывает файлы, чьё имя начинается с подчёркивания.
          touch site/.nojekyll
          du -sh site

      # Разовое действие руками: Settings -> Pages -> Build and deployment ->
      # Source: GitHub Actions. Автоматическое включение (enablement: true)
      # здесь не работает — встроенному GITHUB_TOKEN не хватает прав, нужен
      # персональный токен с администрированием репозитория.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
